[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shopfloor-agent"
version = "0.1.0"
description = "On-prem maintenance agent: open-weight LLMs on CPU, plant data through MCP servers, deterministic evaluation"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
agent = [
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-openai>=1.6",
]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "anyio>=4.9", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
shopfloor = "shopfloor_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shopfloor_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]  # many-args tool APIs, magic numbers in checks, lazy imports

[tool.ruff.lint.per-file-ignores]
"src/shopfloor_agent/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI flags
"src/shopfloor_agent/servers/*.py" = ["PLR0917", "PLR0915"]  # tool signatures are the schema; factories register many tools

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/shopfloor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the downloaded plant data (skipped when missing)",
  "llm: needs a running llama-server (skipped when missing)",
]
