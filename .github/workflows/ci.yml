name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[agent,service,dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      # ~3.5 MB of pinned, checksummed plant data; cached between runs.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: plant-data-c6b96755-v1
      - name: Build the plant database
        run: shopfloor data
      - name: Pytest
        run: pytest

  compose:
    name: Docker Compose stack (model server, service, Jaeger) end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: Smoke test (a question through the stream, metrics, traces)
        run: |
          python3 -m pip install --quiet httpx
          PYTHONPATH=src python3 -m shopfloor_agent.service.smoke http://localhost:8000 \
            --jaeger http://localhost:16686
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down --volumes
