name: Benchmark

# Runs one agent design with one local model on a split of the task suite. Each shard is a
# standard GitHub-hosted runner (4 vCPU, no GPU) with its own llama.cpp server; the report job
# merges the shards. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [granite-4.2-3b, granite-4.2-8b, qwen3.5-4b, qwen3.5-9b]
        default: granite-4.2-3b
      agent:
        type: choice
        options: [react, plan_execute, react_verify, routed]
        default: react
      split:
        type: choice
        options: [dev, test]
        default: dev
      suite:
        description: "main: the 180-task suite; injection / injection_strong: the injection suites"
        type: choice
        options: [main, injection, injection_strong]
        default: main
      defense:
        type: choice
        options: [none, spotlight, sanitize, read_only, approval]
        default: none
      shards:
        description: Parallel runners (each takes every n-th task)
        default: "8"
      max_steps:
        default: "16"
      label:
        description: Optional suffix for the run name
        default: ""

permissions:
  contents: read

concurrency:
  group: benchmark-${{ inputs.model }}-${{ inputs.agent }}-${{ inputs.split }}-${{ inputs.suite }}-${{ inputs.defense }}${{ inputs.label }}
  cancel-in-progress: false

env:
  LLAMA_CPP: b11327
  RUN: ${{ inputs.model }}-${{ inputs.agent }}-${{ inputs.split }}${{ inputs.suite != 'main' && format('-{0}', inputs.suite) || '' }}${{ inputs.defense != 'none' && format('-{0}', inputs.defense) || '' }}${{ inputs.label && format('-{0}', inputs.label) || '' }}
  SUITE: ${{ inputs.suite == 'main' && 'tasks/suite.jsonl' || format('tasks/{0}.jsonl', inputs.suite) }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        run: python3 -c "print('list=' + str(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[agent]"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: plant-data-c6b96755-v1
      - run: shopfloor data
      - name: llama.cpp (pinned release, CPU build)
        id: llama
        uses: actions/cache@v4
        with:
          path: llama
          key: llama-cpp-${{ env.LLAMA_CPP }}-ubuntu-x64
      - if: steps.llama.outputs.cache-hit != 'true'
        run: |
          mkdir -p llama
          curl -sSfL "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP/llama-$LLAMA_CPP-bin-ubuntu-x64.tar.gz" \
            | tar -xz -C llama
      - name: Model
        run: |
          mkdir -p models
          curl -sSfL --retry 3 -o models/model.gguf "$(shopfloor model-url '${{ inputs.model }}')"
          ls -la models
      - name: Start llama-server
        run: |
          server=$(find llama -name llama-server -type f | head -1)
          export LD_LIBRARY_PATH="$(dirname "$server"):$LD_LIBRARY_PATH"
          nohup "$server" -m models/model.gguf --jinja -c 16384 -t "$(nproc)" -np 1 \
            --cache-reuse 256 --host 127.0.0.1 --port 8081 > server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8081/health && break
            sleep 2
          done
          lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Evaluate
        env:
          SHOPFLOOR_LLM_MODEL: ${{ inputs.model }}
        run: |
          shopfloor eval --name "$RUN" --agent "${{ inputs.agent }}" --split "${{ inputs.split }}" \
            --suite "$SUITE" --defense "${{ inputs.defense }}" \
            --max-steps "${{ inputs.max_steps }}" --shard "${{ matrix.shard }}/${{ inputs.shards }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.RUN }}-${{ matrix.shard }}
          path: |
            results/
            server.log
          retention-days: 30

  report:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[agent]"
      - uses: actions/download-artifact@v4
        with:
          pattern: results-${{ env.RUN }}-*
          path: shards
      - name: Merge and report
        run: |
          mkdir -p results
          find shards -name "*.jsonl" -exec cp {} results/ \;
          shopfloor report --run "$RUN" --split "${{ inputs.split }}" --out "results/report-$RUN"
          cat "results/report-$RUN.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ env.RUN }}
          path: results/
          retention-days: 90
